<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000105">
  <meta name="robots" content="noindex,follow">
  <title>Sayfa Bulunamadı | Çiçek Otomotiv</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:#000105;color:#f5f6f7;font-family:Manrope,sans-serif;padding:28px}body::before{content:"";position:fixed;inset:-25%;background:radial-gradient(circle at 50% 42%,rgba(5,51,201,.32),transparent 27%),repeating-radial-gradient(circle at 50% 42%,transparent 0 58px,rgba(15,178,236,.06) 59px 60px);animation:pulse 4s ease-in-out infinite}.wrap{position:relative;z-index:1;width:min(650px,100%);text-align:center}.logo{display:block;width:min(185px,46vw);height:auto;margin:0 auto 48px;filter:drop-shadow(0 0 22px rgba(15,178,236,.25))}.code{font:800 clamp(7rem,26vw,13rem)/.72 Manrope;letter-spacing:-.09em;color:transparent;-webkit-text-stroke:1px rgba(77,121,255,.72);text-shadow:0 0 55px rgba(23,78,255,.32)}.eyebrow{margin:42px 0 14px;font:600 .65rem Space Grotesk;letter-spacing:.18em;text-transform:uppercase;color:#4c79ff}.wrap h1{font-size:clamp(1.8rem,5vw,3rem);letter-spacing:-.055em;margin:0}.wrap p{max-width:480px;margin:18px auto 32px;color:#858a94;font-size:.78rem;line-height:1.75}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.button{min-height:50px;padding:0 23px;display:inline-flex;align-items:center;justify-content:center;gap:26px;border:1px solid rgba(255,255,255,.12);color:#fff;text-decoration:none;font-size:.7rem;font-weight:700;transition:.25s}.button:hover{transform:translateY(-2px);border-color:#174eff}.primary{border-color:transparent;background:linear-gradient(135deg,#073fe8,#142cff);box-shadow:0 0 34px rgba(23,78,255,.25)}.button:focus-visible{outline:2px solid #0fb2ec;outline-offset:4px}@keyframes pulse{50%{transform:scale(1.04);opacity:.76}}@media(max-width:520px){.logo{margin-bottom:34px}.actions{flex-direction:column}.button{width:100%}}@media(prefers-reduced-motion:reduce){body::before{animation:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <a href="/" aria-label="Çiçek Otomotiv ana sayfa"><img class="logo" src="img/cicek-oto-logo.png" width="2153" height="1315" alt="Çiçek OTO"></a>
    <div class="code" aria-hidden="true">404</div>
    <div class="eyebrow">Yanlış bir dönüş yaptık</div>
    <h1>Bu sayfa bulunamadı.</h1>
    <p>Aradığınız bağlantı taşınmış veya artık mevcut olmayabilir. Ana sayfaya dönebilir ya da doğrudan servis randevusu oluşturabilirsiniz.</p>
    <div class="actions"><a class="button primary" href="/">Ana Sayfaya Dön <span>→</span></a><a class="button" href="/#randevu">Randevu Al <span>↗</span></a></div>
  </main>
</body>
</html>
