<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa Bulunamadı — Çiçek Otomotiv</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0D1321;
            color: rgba(255,255,255,.8);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 40px 20px;
        }
        .wrap { max-width: 560px; }
        .num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(7rem, 20vw, 11rem);
            line-height: 1;
            background: linear-gradient(135deg, #C8A84B, #F5D06E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .ico { font-size: 2rem; color: rgba(200,168,75,.4); margin-bottom: 24px; }
        h1 { font-size: 1.6rem; font-weight: 800; color: #fff; margin-bottom: 12px; }
        p { color: rgba(255,255,255,.55); font-size: .95rem; line-height: 1.7; margin-bottom: 36px; }
        .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn-gold {
            display: inline-flex; align-items: center; gap: 9px;
            background: linear-gradient(135deg, #C8A84B, #F5D06E);
            color: #0a0700; font-weight: 700; font-size: .9rem;
            padding: 13px 28px; border-radius: 8px; text-decoration: none;
        }
        .btn-outline {
            display: inline-flex; align-items: center; gap: 9px;
            color: rgba(255,255,255,.7); font-size: .9rem;
            padding: 12px 26px; border-radius: 8px;
            border: 1.5px solid rgba(255,255,255,.15); text-decoration: none;
        }
        .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 40px; }
        .brand-ico { width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg,#C8A84B,#F5D06E); display: flex; align-items: center; justify-content: center; color: #0a0700; font-size: .9rem; }
        .brand-name { font-size: .85rem; font-weight: 800; color: #fff; letter-spacing: .05em; line-height: 1.2; text-align: left; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="brand">
            <div class="brand-ico"><i class="fas fa-gear"></i></div>
            <div class="brand-name"><div>ÇİÇEK</div><div>OTOMOTİV</div></div>
        </div>
        <div class="num">404</div>
        <div class="ico"><i class="fas fa-car-crash"></i></div>
        <h1>Bu Sayfa Bulunamadı</h1>
        <p>Aradığınız sayfa taşınmış, silinmiş veya hiç var olmamış olabilir.<br>Ana sayfaya dönerek devam edebilirsiniz.</p>
        <div class="btns">
            <a href="index.html" class="btn-gold"><i class="fas fa-house"></i> Ana Sayfaya Dön</a>
            <a href="index.html#randevu" class="btn-outline"><i class="fas fa-calendar-check"></i> Randevu Al</a>
        </div>
    </div>
</body>
</html>
